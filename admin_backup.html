<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Stovensa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            color: #222;
        }

        header {
            background: #0b3d91;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h2 {
            margin-top: 0;
            color: #0b3d91;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 10px;
        }

        .preview {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .preview img,
        .preview video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #0b3d91;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        button:active {
            transform: scale(.99);
        }

        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #eef3ff;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Stovensa</h1>
    <p>Kelola website Stovensa</p>
</header>

<div class="container">

    <div class="card">

        <h2>📝 Konten Website</h2>

        <label for="judul">
            Judul
        </label>

        <input
            type="text"
            id="judul"
            placeholder="Masukkan judul website">

        <label for="deskripsi">
            Deskripsi / Tulisan
        </label>

        <textarea
            id="deskripsi"
            placeholder="Masukkan tulisan website">
        </textarea>

    </div>


    <div class="card">

        <h2>🖼️ Foto</h2>

        <label for="foto">
            Pilih foto
        </label>

        <input
            type="file"
            id="foto"
            accept="image/*">

        <div
            class="preview"
            id="fotoPreview">

            <img
                id="fotoImage"
                alt="Preview foto">

        </div>

    </div>


    <div class="card">

        <h2>🎥 Video</h2>

        <label for="video">
            Pilih video
        </label>

        <input
            type="file"
            id="video"
            accept="video/*">

        <div
            class="preview"
            id="videoPreview">

            <video
                id="videoPlayer"
                controls>
            </video>

        </div>

    </div>


    <div class="card">

        <button onclick="simpanData()">
            💾 SIMPAN KE GITHUB
        </button>

        <div id="status"></div>

    </div>

</div>


<script>

const foto =
    document.getElementById("foto");

const video =
    document.getElementById("video");


/* PREVIEW FOTO */

foto.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const url =
        URL.createObjectURL(file);

    document.getElementById(
        "fotoImage"
    ).src = url;

    document.getElementById(
        "fotoPreview"
    ).style.display = "block";
});


/* PREVIEW VIDEO */

video.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const url =
        URL.createObjectURL(file);

    document.getElementById(
        "videoPlayer"
    ).src = url;

    document.getElementById(
        "videoPreview"
    ).style.display = "block";
});


/* SIMPAN KE SERVER */

async function simpanData() {

    const judul =
        document.getElementById(
            "judul"
        ).value;

    const deskripsi =
        document.getElementById(
            "deskripsi"
        ).value;

    const status =
        document.getElementById(
            "status"
        );

    status.style.display = "block";

    status.textContent =
        "⏳ Mengirim ke GitHub...";


    try {

        const response =
            await fetch(
                "/save",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        judul: judul,
                        deskripsi: deskripsi
                    })
                }
            );


        const result =
            await response.json();


        if (result.success) {

            status.textContent =
                "✅ Berhasil dikirim ke GitHub!";

        } else {

            status.textContent =
                "❌ " +
                result.message;

            console.log(
                result.error
            );
        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Server Termux tidak dapat dihubungi.";
    }

}

</script>

</body>
</html>
