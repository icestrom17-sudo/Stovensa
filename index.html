<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stovensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #090d16;
    --card-bg: rgba(255, 255, 255, 0.03);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
html { scroll-behavior: smooth; background-color: var(--bg-dark); color: var(--text-primary); }
body { overflow-x: hidden; position: relative; min-height: 100vh; display: flex; flex-direction: column; }

/* BACKGROUND GLOW */
.bg-glow-1 { position: fixed; top: -100px; left: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(59, 130, 246, 0.25), transparent 70%); filter: blur(80px); z-index: -1; pointer-events: none; }
.bg-glow-2 { position: fixed; bottom: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.2), transparent 70%); filter: blur(100px); z-index: -1; pointer-events: none; }

/* NAVBAR & TAB SWITCHER */
nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 1000px; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 50px; z-index: 1000; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
.logo { font-size: 18px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; color: transparent; cursor: pointer; }

.nav-tabs { display: flex; gap: 8px; }
.tab-btn { background: transparent; border: 0; color: var(--text-secondary); padding: 8px 16px; border-radius: 30px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s ease; }
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }

/* HERO HEADER */
.hero-mini { padding: 130px 20px 30px; text-align: center; }
.hero-mini h1 { font-size: clamp(32px, 6vw, 55px); font-weight: 800; background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%); -webkit-background-clip: text; color: transparent; }
.hero-mini p { color: var(--text-secondary); font-size: 15px; margin-top: 8px; max-width: 600px; margin-left: auto; margin-right: auto; }

/* CONTAINER & TABS */
.container { max-width: 1100px; margin: 0 auto; padding: 20px 20px 80px; flex: 1; width: 100%; }
.tab-content { display: none; animation: fadeIn 0.4s ease-in-out forwards; }
.tab-content.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* GRID & CARDS */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; }

.card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; overflow: hidden; backdrop-filter: blur(10px); transition: all 0.3s ease; display: flex; flex-direction: column; }
.card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05); }

.card-media { width: 100%; height: 230px; overflow: hidden; background: #000; }
.card-media img, .card-media video { width: 100%; height: 100%; object-fit: cover; display: block; }

.card-body { padding: 24px; flex: 1; }
.card-body h3 { font-size: 19px; font-weight: 700; margin-bottom: 10px; color: var(--text-primary); }
.card-body p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-line; }

footer { border-top: 1px solid var(--card-border); padding: 40px 20px; text-align: center; background: rgba(9, 13, 22, 0.8); }

@media (max-width: 768px) {
    nav { width: 95%; padding: 8px 12px; }
    .logo { font-size: 15px; }
    .tab-btn { padding: 6px 10px; font-size: 11px; }
}
</style>
</head>
<body>

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- NAVBAR TAB MENU -->
<nav>
    <div class="logo" onclick="switchTab('berita')">STOVENSA</div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('berita')">📰 Berita</button>
        <button class="tab-btn" onclick="switchTab('jadwal')">📅 Jadwal</button>
        <button class="tab-btn" onclick="switchTab('struktur')">👥 Struktur</button>
    </div>
</nav>

<!-- HEADER UTAMA -->
<div class="hero-mini">
    <h1>Stovensa</h1>
    <!-- STOVENSA_DESKRIPSI_START -->
<p>Buatan izaas</p>
<!-- STOVENSA_DESKRIPSI_END -->
</div>

<!-- CONTAINER DEPAN -->
<div class="container">

    <!-- TAB 1: BERITA -->
    <div id="tab-berita" class="tab-content active">
        <div class="grid">
            <!-- STOVENSA_BERITA_START -->

            <div class="card">
                
                
                    <div class="card-body">
                        <h3>Lomba 17 Agustus</h3>
                        <p>7A berasil melaju kebabak basket berikutnya</p>
                    </div>
                
            </div>
        
<!-- STOVENSA_BERITA_END -->
        </div>
    </div>

    <!-- TAB 2: JADWAL -->
    <div id="tab-jadwal" class="tab-content">
        <div class="grid">
            <!-- STOVENSA_JADWAL_START -->
<div class="card"><div class="card-body"><h3>Belum Ada Data</h3><p>Belum ada postingan jadwal.</p></div></div>
<!-- STOVENSA_JADWAL_END -->
        </div>
    </div>

    <!-- TAB 3: STRUKTUR -->
    <div id="tab-struktur" class="tab-content">
        <div class="grid">
            <!-- STOVENSA_STRUKTUR_START -->

            <div class="card">
                <div class="card-media"><img src="media/1786623219962_s2is3i.jpg" alt="Raja dari segala raja"></div>
                
                    <div class="card-body">
                        <h3>Raja dari segala raja</h3>
                        <p>Izaas kesatria Minecraft</p>
                    </div>
                
            </div>
        
<!-- STOVENSA_STRUKTUR_END -->
        </div>
    </div>

</div>

<footer>
    <h3>STOVENSA</h3>
    <p>© 2026 Stovensa. All rights reserved.</p>
</footer>

<script>
function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

    const selectedTab = document.getElementById('tab-' + tabName);
    if (selectedTab) selectedTab.classList.add('active');

    event.target.classList.add('active');
}
</script>
</body>
</html>
