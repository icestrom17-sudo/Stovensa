<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Admin Stovensa</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033;
}

header{
    background:linear-gradient(
        135deg,
        #1769ff,
        #7c3aed
    );
    color:white;
    padding:30px 20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#1769ff;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d6dce6;
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:120px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    width:100%;
    background:#1769ff;
    color:white;
}

.add{
    margin-top:15px;
    background:#16a34a;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
    margin-top:10px;
}

.preview{
    display:none;
    margin-top:15px;
}

.preview img,
.preview video{
    width:100%;
    max-height:400px;
    object-fit:contain;
    border-radius:12px;
}

.item{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:15px;
    margin-top:12px;
}

.item img,
.item video{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
}

.status{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#eef4ff;
}

.small{
    color:#64748b;
    font-size:14px;
    line-height:1.6;
}

</style>

</head>

<body>

<header>

<h1>⚙️ Admin Stovensa</h1>

<p>
Panel kontrol website
</p>

</header>


<div class="container">


<!-- WEBSITE -->

<div class="card">

<h2>🌐 Website</h2>

<label>
Judul utama
</label>

<input
id="judul"
placeholder="STOVENSA">

<label>
Deskripsi
</label>

<textarea
id="deskripsi"
placeholder="Deskripsi website">
</textarea>

<button
class="primary"
onclick="saveWebsite()">

💾 Simpan Website

</button>

</div>


<!-- BERITA -->

<div class="card">

<h2>📰 Berita</h2>

<label>
Judul berita
</label>

<input
id="beritaJudul"
placeholder="Judul berita">

<label>
Isi berita
</label>

<textarea
id="beritaIsi"
placeholder="Isi berita">
</textarea>

<button
class="add"
onclick="addNews()">

➕ Tambah Berita

</button>

<div id="beritaList"></div>

</div>


<!-- FOTO -->

<div class="card">

<h2>📸 Foto</h2>

<input
id="foto"
type="file"
accept="image/*">

<div
id="fotoPreview"
class="preview">

<img
id="fotoPreviewImage">

</div>

<button
class="add"
onclick="uploadPhoto()">

📤 Upload Foto

</button>

<div id="fotoList"></div>

</div>


<!-- VIDEO -->

<div class="card">

<h2>🎬 Video</h2>

<input
id="video"
type="file"
accept="video/*">

<div
id="videoPreview"
class="preview">

<video
id="videoPreviewPlayer"
controls>
</video>

</div>

<button
class="add"
onclick="uploadVideo()">

📤 Upload Video

</button>

<div id="videoList"></div>

<p class="small">

Gunakan video berukuran wajar.
Video besar membutuhkan waktu upload
lebih lama dan dapat ditolak oleh GitHub.

</p>

</div>


<!-- STATUS -->

<div class="card">

<h2>📡 Status</h2>

<div
id="status"
class="status">
Menunggu...
</div>

</div>


</div>


<script>

let siteData = null;


/* LOAD DATA */

async function loadData(){

    try{

        const response =
            await fetch("/api/data");

        siteData =
            await response.json();

        document.getElementById(
            "judul"
        ).value =
            siteData.judul || "";

        document.getElementById(
            "deskripsi"
        ).value =
            siteData.deskripsi || "";

        renderLists();

    }catch(error){

        showStatus(
            "❌ Gagal mengambil data.",
            true
        );

        console.error(error);

    }

}


/* STATUS */

function showStatus(
    text,
    error=false
){

    const status =
        document.getElementById(
            "status"
        );

    status.style.display =
        "block";

    status.textContent =
        text;

}


/* KIRIM */

async function send(data){

    showStatus(
        "⏳ Menyimpan..."
    );

    try{

        const response =
            await fetch(
                "/api/save",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(data)
                }
            );

        const result =
            await response.json();

        if(!result.success){

            throw new Error(
                result.message
            );

        }

        siteData =
            result.data;

        renderLists();

        showStatus(
            "✅ Berhasil disimpan ke GitHub."
        );

    }catch(error){

        console.error(error);

        showStatus(
            "❌ " +
            error.message,
            true
        );

    }

}


/* WEBSITE */

function saveWebsite(){

    send({

        aksi:"website",

        judul:
            document.getElementById(
                "judul"
            ).value,

        deskripsi:
            document.getElementById(
                "deskripsi"
            ).value

    });

}


/* BERITA */

function addNews(){

    const judul =
        document.getElementById(
            "beritaJudul"
        ).value;

    const isi =
        document.getElementById(
            "beritaIsi"
        ).value;

    if(!judul || !isi){

        alert(
            "Isi judul dan berita terlebih dahulu."
        );

        return;
    }

    send({

        aksi:"tambah_berita",

        beritaJudul:judul,

        beritaIsi:isi

    });

    document.getElementById(
        "beritaJudul"
    ).value="";

    document.getElementById(
        "beritaIsi"
    ).value="";

}


/* FOTO PREVIEW */

document.getElementById(
    "foto"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const url =
            URL.createObjectURL(file);

        document.getElementById(
            "fotoPreviewImage"
        ).src = url;

        document.getElementById(
            "fotoPreview"
        ).style.display =
            "block";

    }
);


/* VIDEO PREVIEW */

document.getElementById(
    "video"
).addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const url =
            URL.createObjectURL(file);

        document.getElementById(
            "videoPreviewPlayer"
        ).src = url;

        document.getElementById(
            "videoPreview"
        ).style.display =
            "block";

    }
);


/* UPLOAD FOTO */

async function uploadPhoto(){

    const input =
        document.getElementById(
            "foto"
        );

    const file =
        input.files[0];

    if(!file){

        alert(
            "Pilih foto terlebih dahulu."
        );

        return;
    }

    const base64 =
        await fileToBase64(file);

    await send({

        aksi:"upload_media",

        type:"image",

        nama:file.name,

        data:base64

    });

    input.value="";

}


/* UPLOAD VIDEO */

async function uploadVideo(){

    const input =
        document.getElementById(
            "video"
        );

    const file =
        input.files[0];

    if(!file){

        alert(
            "Pilih video terlebih dahulu."
        );

        return;
    }

    if(
        file.size >
        50 * 1024 * 1024
    ){

        alert(
            "Video terlalu besar. Gunakan video di bawah 50 MB."
        );

        return;
    }

    const base64 =
        await fileToBase64(file);

    await send({

        aksi:"upload_media",

        type:"video",

        nama:file.name,

        data:base64

    });

    input.value="";

}


/* FILE KE BASE64 */

function fileToBase64(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* RENDER */

function renderLists(){

    if(!siteData) return;


    const berita =
        document.getElementById(
            "beritaList"
        );

    berita.innerHTML="";

    siteData.berita.forEach(
        item=>{

            berita.innerHTML += `

            <div class="item">

                <strong>
                    ${escapeHTML(item.judul)}
                </strong>

                <p>
                    ${escapeHTML(item.isi)}
                </p>

                <button
                    class="delete"
                    onclick="deleteItem(
                        'hapus_berita',
                        '${item.id}'
                    )">

                    🗑️ Hapus

                </button>

            </div>

            `;

        }
    );


    const foto =
        document.getElementById(
            "fotoList"
        );

    foto.innerHTML="";

    siteData.foto.forEach(
        item=>{

            foto.innerHTML += `

            <div class="item">

                <strong>
                    ${escapeHTML(item.nama)}
                </strong>

                <img
                    src="${item.url}">

                <button
                    class="delete"
                    onclick="deleteItem(
                        'hapus_foto',
                        '${item.id}'
                    )">

                    🗑️ Hapus Foto

                </button>

            </div>

            `;

        }
    );


    const video =
        document.getElementById(
            "videoList"
        );

    video.innerHTML="";

    siteData.video.forEach(
        item=>{

            video.innerHTML += `

            <div class="item">

                <strong>
                    ${escapeHTML(item.nama)}
                </strong>

                <video
                    controls
                    src="${item.url}">
                </video>

                <button
                    class="delete"
                    onclick="deleteItem(
                        'hapus_video',
                        '${item.id}'
                    )">

                    🗑️ Hapus Video

                </button>

            </div>

            `;

        }
    );

}


/* DELETE */

function deleteItem(
    aksi,
    id
){

    if(
        !confirm(
            "Yakin ingin menghapus?"
        )
    ){

        return;

    }

    send({

        aksi:aksi,

        id:id

    });

}


/* ESCAPE */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


loadData();

</script>

</body>
</html>
