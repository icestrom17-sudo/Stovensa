<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Stovensa</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #172033; }
header { background: linear-gradient(135deg, #1769ff, #7c3aed); color: white; padding: 28px 20px; text-align: center; }
header h1 { margin: 0 0 8px; }
.container { max-width: 850px; margin: auto; padding: 20px; }
.card { background: white; padding: 22px; margin-bottom: 20px; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.card h2 { margin-top: 0; color: #1769ff; }
label { display: block; font-weight: bold; margin: 15px 0 7px; }
input, textarea { width: 100%; padding: 13px; border: 1px solid #d5dbe5; border-radius: 10px; font-size: 16px; font-family: inherit; }
textarea { min-height: 100px; resize: vertical; }
button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #1769ff; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
button:hover { background: #0d55d9; }

/* ITEM KELOLA & TOMBOL HAPUS */
.item-list { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
.item-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
.item-info { flex: 1; padding-right: 10px; overflow: hidden; }
.item-info h4 { margin: 0 0 5px; font-size: 16px; }
.item-info p { margin: 0; font-size: 13px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-preview-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; margin-right: 10px; }
.btn-delete { width: auto; padding: 8px 14px; background: #ef4444; color: white; border: 0; border-radius: 8px; font-size: 13px; margin: 0; }
.btn-delete:hover { background: #dc2626; }

#status { display: none; margin-top: 15px; padding: 13px; border-radius: 10px; background: #eef4ff; font-weight: bold; position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 850px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 100; }
</style>
</head>
<body>

<header>
    <h1>⚙️ Admin Stovensa</h1>
    <p>Kelola isi website Stovensa secara langsung</p>
</header>

<div class="container">

    <!-- SETTING UTAMA -->
    <div class="card">
        <h2>✏️ Informasi Utama</h2>
        <label for="judul">Judul Website</label>
        <input id="judul" type="text" placeholder="STOVENSA">
        
        <label for="deskripsi">Deskripsi</label>
        <textarea id="deskripsi" placeholder="Tulis deskripsi Stovensa..."></textarea>
        
        <button onclick="simpanInfo()">💾 Simpan Info Utama</button>
    </div>

    <!-- KELOLA BERITA -->
    <div class="card">
        <h2>📰 Kelola Berita</h2>
        <label for="beritaJudul">Judul Berita Baru</label>
        <input id="beritaJudul" type="text" placeholder="Judul berita baru">
        
        <label for="beritaIsi">Isi Berita</label>
        <textarea id="beritaIsi" placeholder="Tuliskan berita..."></textarea>
        
        <button onclick="tambahBerita()">➕ Tambah Berita</button>

        <h3 style="margin-top:25px; font-size:16px;">Daftar Berita Ada:</h3>
        <div id="daftarBerita" class="item-list"><i>Memuat berita...</i></div>
    </div>

    <!-- KELOLA FOTO -->
    <div class="card">
        <h2>📸 Kelola Foto</h2>
        <input id="fotoInput" type="file" accept="image/*">
        <button onclick="uploadMedia('image')">📤 Upload Foto</button>

        <h3 style="margin-top:25px; font-size:16px;">Daftar Foto Ada:</h3>
        <div id="daftarFoto" class="item-list"><i>Memuat foto...</i></div>
    </div>

    <!-- KELOLA VIDEO -->
    <div class="card">
        <h2>🎬 Kelola Video</h2>
        <input id="videoInput" type="file" accept="video/*">
        <button onclick="uploadMedia('video')">📤 Upload Video</button>

        <h3 style="margin-top:25px; font-size:16px;">Daftar Video Ada:</h3>
        <div id="daftarVideo" class="item-list"><i>Memuat video...</i></div>
    </div>

    <div id="status"></div>
</div>

<script>
const statusDiv = document.getElementById("status");

function showStatus(msg, isSuccess = true) {
    statusDiv.style.display = "block";
    statusDiv.style.background = isSuccess ? "#eef4ff" : "#fef2f2";
    statusDiv.style.color = isSuccess ? "#1e40af" : "#991b1b";
    statusDiv.textContent = msg;
    setTimeout(() => { if(isSuccess) statusDiv.style.display = "none"; }, 4000);
}

// Ambil & Tampilkan data terbaru dari server
async function loadData() {
    try {
        const res = await fetch("/api/data");
        const data = await res.json();
        
        document.getElementById("judul").value = data.judul || "";
        document.getElementById("deskripsi").value = data.deskripsi || "";

        // Render List Berita
        const beritaBox = document.getElementById("daftarBerita");
        if (!data.berita || data.berita.length === 0) {
            beritaBox.innerHTML = "<p style='color:#94a3b8;'>Belum ada berita.</p>";
        } else {
            beritaBox.innerHTML = data.berita.map(b => `
                <div class="item-row">
                    <div class="item-info">
                        <h4>${b.judul}</h4>
                        <p>${b.isi}</p>
                    </div>
                    <button class="btn-delete" onclick="hapusItem('hapus_berita', '${b.id}')">🗑️ Hapus</button>
                </div>
            `).join("");
        }

        // Render List Foto
        const fotoBox = document.getElementById("daftarFoto");
        if (!data.foto || data.foto.length === 0) {
            fotoBox.innerHTML = "<p style='color:#94a3b8;'>Belum ada foto.</p>";
        } else {
            fotoBox.innerHTML = data.foto.map(f => `
                <div class="item-row">
                    <img src="${f.url}" class="item-preview-img">
                    <div class="item-info">
                        <h4>${f.nama}</h4>
                    </div>
                    <button class="btn-delete" onclick="hapusItem('hapus_foto', '${f.id}')">🗑️ Hapus</button>
                </div>
            `).join("");
        }

        // Render List Video
        const videoBox = document.getElementById("daftarVideo");
        if (!data.video || data.video.length === 0) {
            videoBox.innerHTML = "<p style='color:#94a3b8;'>Belum ada video.</p>";
        } else {
            videoBox.innerHTML = data.video.map(v => `
                <div class="item-row">
                    <div class="item-info">
                        <h4>${v.nama}</h4>
                    </div>
                    <button class="btn-delete" onclick="hapusItem('hapus_video', '${v.id}')">🗑️ Hapus</button>
                </div>
            `).join("");
        }

    } catch (e) {
        console.error(e);
    }
}
loadData();

async function sendData(payload) {
    showStatus("⏳ Mengirim perubahan ke server & GitHub...");
    try {
        const res = await fetch("/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
            showStatus("✅ Perubahan berhasil disimpan & di-push ke GitHub!");
            loadData(); // Reload list
        } else {
            showStatus("❌ Gagal: " + result.message, false);
        }
    } catch (e) {
        showStatus("❌ Gagal terhubung ke server Termux.", false);
    }
}

function simpanInfo() {
    const judul = document.getElementById("judul").value;
    const deskripsi = document.getElementById("deskripsi").value;
    sendData({ judul, deskripsi });
}

function tambahBerita() {
    const beritaJudul = document.getElementById("beritaJudul").value;
    const beritaIsi = document.getElementById("beritaIsi").value;
    if (!beritaJudul || !beritaIsi) return alert("Judul dan isi berita wajib diisi!");
    
    sendData({
        aksi: "tambah_berita",
        beritaJudul,
        beritaIsi
    });

    document.getElementById("beritaJudul").value = "";
    document.getElementById("beritaIsi").value = "";
}

function uploadMedia(type) {
    const input = document.getElementById(type === 'image' ? 'fotoInput' : 'videoInput');
    const file = input.files[0];
    if (!file) return alert("Pilih file terlebih dahulu!");

    const reader = new FileReader();
    reader.onload = function(e) {
        sendData({
            aksi: "upload_media",
            type: type,
            data: e.target.result,
            nama: file.name
        });
        input.value = "";
    };
    reader.readAsDataURL(file);
}

function hapusItem(aksi, id) {
    if (confirm("Apakah kamu yakin ingin menghapus item ini?")) {
        sendData({ aksi, id });
    }
}
</script>
</body>
</html>
